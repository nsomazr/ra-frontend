<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in · REET CBM P10354</title>
  <link rel="stylesheet" href="styles.css?v=7">
</head>
<body>
  <main class="shell" style="max-width:480px;padding-top:9vh">
    <section class="card pad">
      <p class="label">REET Limited · CBM P10354</p>
      <h1>Sign in</h1>
      <p>Authenticate against the assessment API. Session tokens are stored for this browser only.</p>
      <form id="login" class="stack" style="margin-top:18px">
        <label>Username
          <input name="username" autocomplete="username" required>
        </label>
        <label>Password
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <p id="error" class="notice hidden" style="color:#8a1f1f"></p>
        <button class="btn large" type="submit">Sign in</button>
      </form>
      <p class="help" style="margin-top:18px">
        API: <code id="api-host">…</code>
      </p>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="api.js?v=7"></script>
  <script src="login.js?v=7"></script>
</body>
</html>
