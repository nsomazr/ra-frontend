<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#123b5d">
  <link rel="icon" type="image/png" href="assets/reet-icon.png">
  <title>REET Field Assessment System · P10354</title>
  <style>
    :root{color-scheme:light;--navy:#123b5d;--cyan:#16a9d4;--orange:#f5a400;--bg:#f4f7f9;--line:#d8e2e9;--muted:#617180}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:#17212b;font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
    main{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(560px,100%);background:#fff;border:1px solid var(--line);border-radius:14px;padding:34px;box-shadow:0 8px 28px rgba(18,59,93,.09);text-align:center}
    img{width:220px;max-width:78%;margin:0 auto 18px;display:block}.bar{height:5px;width:110px;border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--orange));margin:0 auto 20px}.label{color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:11px}.btn{display:inline-block;background:var(--navy);color:#fff;text-decoration:none;padding:11px 16px;border-radius:8px;font-weight:700;margin-top:10px}.help{color:var(--muted);font-size:12px;margin-top:14px}
  </style>
</head>
<body>
  <main><section class="card">
    <img src="assets/reet-logo.png" alt="REET – Collaborative. Sustainable. Transformative.">
    <div class="bar" aria-hidden="true"></div>
    <div class="label">P10354 Field Assessment System</div>
    <h1>Opening the Project Command Centre</h1>
    <p class="help">Please wait while the field dashboard loads.</p>
    <a class="btn" href="login.html">Sign in</a>
  </section></main>
  <script>setTimeout(()=>location.replace('login.html'),700);</script>
</body>
</html>
