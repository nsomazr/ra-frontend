<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Change Password · REET CBM P10354</title>
  <link rel="stylesheet" href="styles.css?v=10">
  <meta name="theme-color" content="#123b5d">
  <link rel="icon" type="image/png" href="assets/reet-icon.png">
</head>
<body>
  <main class="shell" style="max-width:540px;padding-top:9vh">
    <section class="card pad">
      <p class="label">Initial administrator security step</p>
      <h1>Set a new password</h1>
      <p class="help">The initial password can be used once only. It is not stored or displayed after this change.</p>
      <form id="change">
        <label class="field"><span>New password</span>
          <input name="password" type="password" minlength="12" required autocomplete="new-password"></label>
        <label class="field"><span>Confirm password</span>
          <input name="confirm" type="password" minlength="12" required autocomplete="new-password"></label>
        <p id="error" class="notice red hidden"></p>
        <button class="btn large" style="width:100%">Save password</button>
      </form>
      <p class="help" style="margin-top:16px">
        Prototype only. Production password handling belongs on the server with Argon2id or bcrypt —
        see <code>architecture.md</code>.
      </p>
    </section>
  </main>
  <script src="/config.js"></script>
  <script src="api.js?v=10"></script>
  <script src="framework.js?v=10"></script>
  <script src="sync-config.js?v=2"></script>
  <script src="data.js?v=10"></script>
  <script src="change-password.js?v=10"></script>
</body>
</html>
