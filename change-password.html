<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Change Password · REET CBM P10354</title>
  <link rel="stylesheet" href="styles.css?v=11">
</head>
<body>
  <main class="auth-page gate-page">
    <div class="auth-shell">
      <div class="auth-brand">
        <div class="mark" aria-hidden="true">R</div>
        <h1>Set a new password</h1>
        <p>Required before using the field system</p>
      </div>
      <section class="auth-card">
        <form id="change" class="stack">
          <label>New password
            <input name="password" type="password" minlength="12" required autocomplete="new-password" placeholder="At least 12 characters">
          </label>
          <label>Confirm password
            <input name="confirm" type="password" minlength="12" required autocomplete="new-password" placeholder="Repeat password">
          </label>
          <p id="error" class="notice red hidden"></p>
          <button class="btn large" type="submit">Save password</button>
        </form>
        <p class="auth-meta">Password is hashed and stored by the API.</p>
      </section>
    </div>
  </main>
  <script src="config.js"></script>
  <script src="api.js?v=11"></script>
  <script src="framework.js?v=11"></script>
  <script src="data.js?v=11"></script>
  <script src="change-password.js?v=11"></script>
</body>
</html>
